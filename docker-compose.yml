services:
  
  zookeeper:
    networks:
      dapr-csharp-net:
        ipv4_address: ${ZOOKEEPER_HOST_1}

    image: ghcr.io/dapr/3rdparty/zookeeper:latest
    ports:
      - "2181:2181"

  kafka:
    networks:
      dapr-csharp-net:
        ipv4_address: ${KAFKA_HOST_1}
        
    image: ghcr.io/dapr/3rdparty/kafka:latestS
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: ${KAFKA_HOST_1}
      KAFKA_CREATE_TOPICS: "sample:1:1"
      KAFKA_ZOOKEEPER_CONNECT: ${ZOOKEEPER_HOST_1}:2181
    depends_on: [zookeeper]
      
  subscriber:
    build: ./subscriber
    container_name: subscriber
    environment:
      - ASPNETCORE_URLS=http://+:8080
    expose:
      - "8080"

  subscriber-daprd:
    networks:
      dapr-csharp-net:
        ipv4_address: ${SUBSCRIBER_HOST_1}
    image: "daprio/daprd:latest"
    container_name: subscriber-daprd
    command: [
      "./daprd",
      "--app-id", "subscriber",
      "--app-port", "8080",
      "--resources-path", "/components",
      "--log-level", "debug"
    ]
    volumes:
      - ./subscriber/components:/components:ro
    depends_on: [kafka, subscriber]

  publisher:
    build: ./publisher
    container_name: publisher

  publisher-daprd:
    networks:
      dapr-csharp-net:
        ipv4_address: ${PUBLISHER_HOST_1}
    image: "daprio/daprd:latest"
    container_name: publisher-daprd
    command: [
      "./daprd",
      "--app-id", "publisher",
      "--resources-path", "/components",
      "--log-level", "debug"
    ]
    volumes:
      - ./publisher/components:/components:ro
    depends_on: [kafka, publisher]

networks:
  dapr-csharp-net:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
