  # Dapr sidecar for .NET Dapr Client API
  dotnet-dapr-client-sidecar:
    image: ghcr.io/dapr/daprd:${DAPR_VERSION}
    container_name: dotnet-dapr-client-sidecar
    command: [
      "./daprd",
      "--log-level", "debug",
      "--app-id", "dotnet-dapr-client-sidecar",
      "--app-port", "${DOT_NET_APP_PORT}",
      "--dapr-http-port", "${DOT_NET_HTTP_PORT}",
      "--dapr-grpc-port", "${DOT_NET_GRPC_PORT}",
      "--placement-host-address", "dapr-placement:${DAPR_PLACEMENT_PORT}",
      "--scheduler-host-address", "dapr-scheduler:${DAPR_SCHEDULER_PORT}",
      "--resources-path", "/components",
      "--config", "/components/config.yaml"
    ]
    environment:
      - DAPR_COMPONENTS_SOCKETS_FOLDER=/var/run
    volumes:
      - "./components:/components:ro"
    ports:
      - "${DOT_NET_HTTP_PORT}:${DOT_NET_HTTP_PORT}"
      - "${DOT_NET_GRPC_PORT}:${DOT_NET_GRPC_PORT}"
    networks:
      - dapr-csharp-net
    depends_on:
      - redis-pubsub
  
  subscriber-image:
#    build: ./subscriber
    image: subscriber:latest
    container_name: subscriber
    networks:
      - dapr-csharp-net
    depends_on:
      #      dapr-scheduler:
      #        condition: service_healthy
      #      dapr-placement:
      #        condition: service_healthy
      kafka:
        condition: service_healthy
  
  # .NET Dapr Subscriber
  subscriber-daprd:
    build: .
    image: subscriber:latest
    container_name: dotnet-dapr-subscriber
    ports:
      - "${DOT_NET_HOST_PORT1}:${DOT_NET_APP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:${DOT_NET_APP_PORT}
      - DAPR_HTTP_ENDPOINT=http://dotnet-dapr-client-sidecar:${DOT_NET_HTTP_PORT}
      - DAPR_GRPC_ENDPOINT=http://dotnet-dapr-client-sidecar:${DOT_NET_GRPC_PORT}
    expose:
      - "8080"
    networks:
      - dapr-csharp-net
    depends_on: [ kafka, subscriber-image ]

  publisher-image:
