networks:
  dapr-csharp-net:
    driver: bridge


# Named volumes for persistence
volumes:
  dapr-placement-data:
    driver: local
    name: ${DAPR_PLACEMENT_VOLUME:-dapr-placement-data}
  dapr-scheduler-data:
    driver: local
    name: ${DAPR_SCHEDULER_VOLUME:-dapr-scheduler-data}
  dapr-zipkin-data:
    driver: local
    name: ${DAPR_ZIPKIN_VOLUME:-dapr-zipkin-data}
  redis-data:
  zookeeper_logs:
    driver: local
  zookeeper_data:
    driver: local